<!DOCTYPE html>
<style>
  body { margin: 0; }
  .box { display: inline-block; width: 50px; height: 50px; margin: 0; border: 1px solid black; }
</style>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    for (let i = 0; i < 100; ++i) {
      const box = document.createElement('div');
      box.classList.add('box');
      box.textContent = i;
      document.body.appendChild(box);
    }
  });
</script>
