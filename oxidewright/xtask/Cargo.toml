[package]
name = "oxidewright-xtask"
version = "0.0.0"
rust-version = "1.85"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Maintenance tasks of oxidewright (regenerating the bundled injected scripts)"
publish = false

[dependencies]
flate2 = "1"
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
tokio = { version = "1", features = ["rt", "macros"] }
