[package]
name = "oxidewright"
version = "0.1.0"
rust-version = "1.85"
edition = "2024"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/hugocorreia2004/chromiumoxide"
description = "A Rust port of the Playwright API for Chromium, built on chromiumoxide"
keywords = ["playwright", "chrome", "automation", "testing", "cdp"]
categories = ["web-programming", "api-bindings", "development-tools::testing"]
include = [
  "src/**/*",
  "scripts/*",
  "README.md",
  "NOTICE",
  "LICENSE-APACHE",
  "LICENSE-MIT",
]

[dependencies]
chromiumoxide = { path = "..", version = "0.9", default-features = false }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "sync", "macros"] }
tracing = "0.1"
url = "2"
regex = "1"
base64 = "0.22"
fastrand = "2"
sha1_smol = "1"

[features]
default = ["stealth"]
# Build chromiumoxide with its `stealth` feature: no `Runtime.enable`,
# `Log.enable` or `Performance.enable` and no utility world at attach.
# oxidewright itself never relies on those domains.
stealth = ["chromiumoxide/stealth"]

[dev-dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }

[[test]]
name = "integration"
path = "tests/integration/main.rs"
harness = true
